<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>維修管理系統</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd8;
    --text: #1a1714;
    --text2: #6b6560;
    --text3: #9e9890;
    --accent: #c9913a;
    --accent-bg: #fdf3e3;
    --accent-hover: #b07e2e;
    --danger: #c0392b;
    --success: #27a469;
    --profit-pos: #27a469;
    --profit-neg: #c0392b;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', 'PingFang TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Setup screen ── */
  #setup-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .setup-card {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); padding: 2rem;
    width: 100%; max-width: 460px;
  }
  .setup-card h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.4rem; }
  .setup-card p { color: var(--text2); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text2); margin-bottom: 0.35rem; }
  .field input {
    width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 0.9rem; color: var(--text);
    background: var(--surface); outline: none; transition: border 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 0.7rem; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius-sm); font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .setup-note { font-size: 0.78rem; color: var(--text3); margin-top: 1rem; text-align: center; }

  /* ── App ── */
  #app { display: none; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 1rem; height: 56px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 100;
  }
  .header-title { font-size: 1.05rem; font-weight: 700; }
  .header-right { display: flex; gap: 0.5rem; align-items: center; }

  main { max-width: 780px; margin: 0 auto; padding: 1rem; }

  /* toolbar */
  .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); }
  .search-input {
    width: 100%; padding: 0.6rem 0.8rem 0.6rem 2.2rem;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 0.9rem; color: var(--text); background: var(--surface);
    outline: none; transition: border 0.15s; height: 42px;
  }
  .search-input:focus { border-color: var(--accent); }
  .icon-btn {
    width: 42px; height: 42px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s; flex-shrink: 0;
    position: relative;
  }
  .icon-btn:hover { background: var(--surface2); }
  .icon-btn svg { width: 16px; height: 16px; stroke: var(--text2); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .badge {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700;
  }
  .new-btn {
    height: 42px; padding: 0 0.9rem; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius-sm); font-size: 0.88rem;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.3rem;
    transition: background 0.15s; white-space: nowrap;
  }
  .new-btn:hover { background: var(--accent-hover); }

  /* stats */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.85rem 1rem;
  }
  .stat-label { font-size: 0.75rem; color: var(--text2); margin-bottom: 0.25rem; }
  .stat-value { font-size: 1.4rem; font-weight: 700; }

  /* list */
  .repair-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .repair-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem;
    cursor: pointer; transition: border-color 0.15s, transform 0.1s;
    display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start;
  }
  .repair-card:hover { border-color: var(--accent); }
  .repair-card:active { transform: scale(0.99); }
  .card-left { flex: 1; min-width: 0; }
  .card-name { font-weight: 600; font-size: 0.95rem; }
  .card-phone { font-size: 0.8rem; color: var(--text2); }
  .card-sub { font-size: 0.82rem; color: var(--text2); margin-top: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
  .card-right { text-align: right; flex-shrink: 0; }
  .card-price { font-size: 0.9rem; font-weight: 600; }
  .card-profit { font-size: 0.78rem; }
  .pos { color: var(--profit-pos); }
  .neg { color: var(--profit-neg); }

  .status-badge {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    font-size: 0.72rem; font-weight: 600;
  }
  .s-pending   { background: #fef3cd; color: #7d5a00; }
  .s-repairing { background: #d1ecf1; color: #0c5460; }
  .s-done      { background: #d4edda; color: #155724; }
  .s-delivered { background: #e2e3e5; color: #383d41; }
  .s-cancelled { background: #f8d7da; color: #721c24; }

  .empty { text-align: center; padding: 4rem 1rem; color: var(--text2); }
  .loading { text-align: center; padding: 4rem 1rem; color: var(--text3); }

  /* FAB */
  .fab {
    position: fixed; bottom: 1.5rem; right: 1.5rem;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: #fff; border: none;
    font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    transition: background 0.15s, transform 0.1s; z-index: 50;
  }
  .fab:hover { background: var(--accent-hover); }
  .fab:active { transform: scale(0.95); }

  /* ── Filter panel ── */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
  }
  .overlay.open { display: block; }
  .filter-panel {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-radius: 18px 18px 0 0;
    padding: 1.25rem 1.25rem 2rem; z-index: 201;
    transform: translateY(100%); transition: transform 0.25s ease;
    max-height: 90vh; overflow-y: auto;
  }
  .filter-panel.open { transform: translateY(0); }
  .panel-title { font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; }
  .filter-row { margin-bottom: 1rem; }
  .filter-row label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text2); margin-bottom: 0.35rem; }
  .filter-row select, .filter-row input[type=date] {
    width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 0.88rem; color: var(--text);
    background: var(--surface); outline: none;
  }
  .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .clear-btn {
    width: 100%; padding: 0.65rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface);
    font-size: 0.88rem; color: var(--text2); cursor: pointer; margin-top: 0.5rem;
  }
  .clear-btn:hover { background: var(--surface2); }

  /* ── Modal (新增/編輯) ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300;
    align-items: center; justify-content: center; padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius);
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    padding: 1.5rem;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
  .modal-title { font-size: 1.1rem; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text2); padding: 0.25rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text2); margin-bottom: 0.3rem; }
  .form-field input, .form-field select {
    width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 0.88rem; color: var(--text);
    background: var(--surface); outline: none; transition: border 0.15s;
  }
  .form-field input:focus, .form-field select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
  .btn-save {
    flex: 1; padding: 0.7rem; background: var(--accent); color: #fff;
    border: none; border-radius: var(--radius-sm); font-size: 0.9rem;
    font-weight: 600; cursor: pointer; transition: background 0.15s;
  }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-delete {
    padding: 0.7rem 1rem; background: none; color: var(--danger);
    border: 1px solid var(--danger); border-radius: var(--radius-sm);
    font-size: 0.9rem; cursor: pointer; transition: background 0.15s;
  }
  .btn-delete:hover { background: #fdecea; }

  /* ── Toast ── */
  #toast-container { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
  .toast {
    background: #1a1714; color: #fff; padding: 0.6rem 1.2rem;
    border-radius: 99px; font-size: 0.88rem; font-weight: 500;
    animation: fadeup 0.25s ease; white-space: nowrap;
  }
  .toast.error { background: var(--danger); }
  @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ── Setup screen ── -->
<div id="setup-screen">
  <div class="setup-card">
    <h1>🔧 維修管理系統</h1>
    <p>請填入你的 Supabase 連線資訊，設定完成後會自動記住。</p>
    <div class="field">
      <label>Supabase URL</label>
      <input id="sb-url" type="text" placeholder="https://xxxx.supabase.co" />
    </div>
    <div class="field">
      <label>Supabase Anon Key</label>
      <input id="sb-key" type="text" placeholder="eyJhbGci..." />
    </div>
    <button class="btn-primary" onclick="connect()">連線並開始使用</button>
    <p class="setup-note">資訊僅儲存在你的瀏覽器（localStorage），不會上傳。</p>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <header>
    <div class="header-title">🔧 維修記錄</div>
    <div class="header-right">
      <button class="new-btn" onclick="openForm()">＋ 新增</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9e9890" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-input" id="search" placeholder="搜尋姓名、電話、項目…" oninput="renderList()" />
      </div>
      <div class="icon-btn" onclick="toggleFilter()" title="篩選">
        <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        <span class="badge" id="filter-badge" style="display:none">0</span>
      </div>
      <div class="icon-btn" onclick="backup()" title="備份 Excel">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </div>
      <div class="icon-btn" onclick="document.getElementById('file-input').click()" title="還原 Excel">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <input id="file-input" type="file" accept=".xlsx" style="display:none" onchange="restore(event)" />
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">筆數</div>
        <div class="stat-value" id="stat-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">總利潤</div>
        <div class="stat-value" id="stat-profit">NT$0</div>
      </div>
    </div>

    <div id="list-area"><div class="loading">載入中…</div></div>
  </main>

  <button class="fab" onclick="openForm()" title="新增維修">＋</button>
</div>

<!-- ── Filter panel ── -->
<div class="overlay" id="overlay" onclick="toggleFilter()"></div>
<div class="filter-panel" id="filter-panel">
  <div class="panel-title">篩選</div>
  <div class="filter-row">
    <label>品牌</label>
    <select id="f-brand" onchange="renderList()">
      <option value="">全部品牌</option>
      <option value="apple">Apple</option>
      <option value="samsung">Samsung</option>
      <option value="oppo">OPPO</option>
      <option value="xiaomi">小米</option>
      <option value="other">其他</option>
    </select>
  </div>
  <div class="filter-row">
    <label>狀態</label>
    <select id="f-status" onchange="renderList()">
      <option value="">全部狀態</option>
      <option value="pending">待維修</option>
      <option value="repairing">維修中</option>
      <option value="done">已完成</option>
      <option value="delivered">已取件</option>
      <option value="cancelled">已取消</option>
    </select>
  </div>
  <div class="filter-row">
    <div class="date-row">
      <div>
        <label>起始日期</label>
        <input type="date" id="f-from" onchange="renderList()" />
      </div>
      <div>
        <label>結束日期</label>
        <input type="date" id="f-to" onchange="renderList()" />
      </div>
    </div>
  </div>
  <button class="clear-btn" onclick="clearFilters()">✕ 清除篩選</button>
</div>

<!-- ── Form Modal ── -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">新增維修</div>
      <button class="modal-close" onclick="closeForm()">✕</button>
    </div>
    <input type="hidden" id="form-id" />
    <div class="form-grid">
      <div class="form-field full">
        <label>客戶名稱 *</label>
        <input id="f-name" type="text" placeholder="王小明" />
      </div>
      <div class="form-field">
        <label>電話 *</label>
        <input id="f-phone" type="text" placeholder="0912-345-678" />
      </div>
      <div class="form-field">
        <label>品牌</label>
        <select id="f-brand-form">
          <option value="apple">Apple</option>
          <option value="samsung">Samsung</option>
          <option value="oppo">OPPO</option>
          <option value="xiaomi">小米</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="form-field">
        <label>型號</label>
        <input id="f-model" type="text" placeholder="iPhone 15 Pro" />
      </div>
      <div class="form-field full">
        <label>維修項目 *</label>
        <input id="f-item" type="text" placeholder="換螢幕" />
      </div>
      <div class="form-field">
        <label>維修日期</label>
        <input id="f-date" type="date" />
      </div>
      <div class="form-field">
        <label>狀態</label>
        <select id="f-status-form">
          <option value="pending">待維修</option>
          <option value="repairing">維修中</option>
          <option value="done">已完成</option>
          <option value="delivered">已取件</option>
          <option value="cancelled">已取消</option>
        </select>
      </div>
      <div class="form-field">
        <label>售價 (NT$)</label>
        <input id="f-price" type="number" placeholder="2500" min="0" />
      </div>
      <div class="form-field">
        <label>成本 (NT$)</label>
        <input id="f-cost" type="number" placeholder="800" min="0" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-delete" id="delete-btn" style="display:none" onclick="deleteRepair()">刪除</button>
      <button class="btn-save" onclick="saveRepair()">儲存</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
const BRAND_LABELS = { apple:'Apple', samsung:'Samsung', oppo:'OPPO', xiaomi:'小米', other:'其他' };
const STATUS_LABELS = { pending:'待維修', repairing:'維修中', done:'已完成', delivered:'已取件', cancelled:'已取消' };
const STATUS_CLASS  = { pending:'s-pending', repairing:'s-repairing', done:'s-done', delivered:'s-delivered', cancelled:'s-cancelled' };
const BRAND_REVERSE  = Object.fromEntries(Object.entries(BRAND_LABELS).map(([k,v])=>[v,k]));
const STATUS_REVERSE = Object.fromEntries(Object.entries(STATUS_LABELS).map(([k,v])=>[v,k]));

let sb = null;
let allRepairs = [];

// ── Supabase 連線 ─────────────────────────────────────────
function connect() {
  const url = document.getElementById('sb-url').value.trim();
  const key = document.getElementById('sb-key').value.trim();
  if (!url || !key) { toast('請填入 URL 和 Key', true); return; }
  localStorage.setItem('sb_url', url);
  localStorage.setItem('sb_key', key);
  initApp(url, key);
}

function initApp(url, key) {
  sb = supabase.createClient(url, key);
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  load();
}

// 自動讀取已儲存的設定
window.addEventListener('DOMContentLoaded', () => {
  const url = localStorage.getItem('sb_url');
  const key = localStorage.getItem('sb_key');
  if (url && key) {
    document.getElementById('sb-url').value = url;
    document.getElementById('sb-key').value = key;
    initApp(url, key);
  }
});

// ── 資料 ──────────────────────────────────────────────────
async function load() {
  document.getElementById('list-area').innerHTML = '<div class="loading">載入中…</div>';
  const { data, error } = await sb.from('repairs').select('*')
    .eq('is_deleted', false)
    .order('repair_date', { ascending: false })
    .order('created_at', { ascending: false });
  if (error) { toast(error.message, true); return; }
  allRepairs = data ?? [];
  renderList();
}

function getFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const brand  = document.getElementById('f-brand').value;
  const status = document.getElementById('f-status').value;
  const from   = document.getElementById('f-from').value;
  const to     = document.getElementById('f-to').value;
  return allRepairs.filter(r => {
    if (brand  && r.brand  !== brand)  return false;
    if (status && r.status !== status) return false;
    if (from   && r.repair_date < from) return false;
    if (to     && r.repair_date > to)  return false;
    if (q) {
      const hay = `${r.customer_name} ${r.phone} ${r.repair_item} ${r.model??''} ${r.imei??''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderList() {
  const list = getFiltered();
  const totalProfit = list.reduce((s,r) => s + (Number(r.price)-Number(r.cost)), 0);

  document.getElementById('stat-count').textContent = list.length;
  const profitEl = document.getElementById('stat-profit');
  profitEl.textContent = fmt(totalProfit);
  profitEl.className = 'stat-value ' + (totalProfit >= 0 ? 'pos' : 'neg');
  updateFilterBadge();

  const area = document.getElementById('list-area');
  if (!list.length) {
    area.innerHTML = '<div class="empty">尚無維修記錄</div>';
    return;
  }

  area.innerHTML = '<div class="repair-list">' +
    list.map(r => {
      const profit = Number(r.price) - Number(r.cost);
      return `<div class="repair-card" onclick="openForm('${r.id}')">
        <div class="card-left">
          <div style="display:flex;gap:0.5rem;align-items:center">
            <span class="card-name">${esc(r.customer_name)}</span>
            <span class="card-phone">${esc(r.phone)}</span>
          </div>
          <div class="card-sub">${BRAND_LABELS[r.brand]??r.brand}${r.model?` · ${esc(r.model)}`:''} · ${esc(r.repair_item)}</div>
          <div class="card-meta">
            <span class="status-badge ${STATUS_CLASS[r.status]??''}">${STATUS_LABELS[r.status]??r.status}</span>
            <span style="font-size:0.75rem;color:var(--text3)">${r.repair_date??''}</span>
          </div>
        </div>
        <div class="card-right">
          <div class="card-price">${fmt(Number(r.price))}</div>
          <div class="card-profit ${profit>=0?'pos':'neg'}">${profit>=0?'+':''}${fmt(profit)}</div>
        </div>
      </div>`;
    }).join('') + '</div>';
}

// ── Filter panel ──────────────────────────────────────────
function toggleFilter() {
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('filter-panel').classList.toggle('open');
}
function clearFilters() {
  ['f-brand','f-status','f-from','f-to'].forEach(id => document.getElementById(id).value = '');
  renderList();
}
function updateFilterBadge() {
  const count = ['f-brand','f-status','f-from','f-to'].filter(id => document.getElementById(id).value).length;
  const badge = document.getElementById('filter-badge');
  if (count) { badge.textContent = count; badge.style.display = 'flex'; }
  else badge.style.display = 'none';
}

// ── Form modal ────────────────────────────────────────────
function openForm(id) {
  const modal = document.getElementById('modal');
  modal.classList.add('open');
  if (!id) {
    document.getElementById('modal-title').textContent = '新增維修';
    document.getElementById('form-id').value = '';
    document.getElementById('delete-btn').style.display = 'none';
    document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
    ['f-name','f-phone','f-model','f-item'].forEach(i => document.getElementById(i).value = '');
    document.getElementById('f-brand-form').value = 'apple';
    document.getElementById('f-status-form').value = 'pending';
    document.getElementById('f-price').value = '';
    document.getElementById('f-cost').value = '';
  } else {
    const r = allRepairs.find(x => x.id === id);
    if (!r) return;
    document.getElementById('modal-title').textContent = '編輯維修';
    document.getElementById('form-id').value = id;
    document.getElementById('delete-btn').style.display = 'block';
    document.getElementById('f-name').value  = r.customer_name ?? '';
    document.getElementById('f-phone').value = r.phone ?? '';
    document.getElementById('f-model').value = r.model ?? '';
    document.getElementById('f-item').value  = r.repair_item ?? '';
    document.getElementById('f-date').value  = r.repair_date ?? '';
    document.getElementById('f-brand-form').value  = r.brand ?? 'apple';
    document.getElementById('f-status-form').value = r.status ?? 'pending';
    document.getElementById('f-price').value = r.price ?? '';
    document.getElementById('f-cost').value  = r.cost ?? '';
  }
}
function closeForm() {
  document.getElementById('modal').classList.remove('open');
}

async function saveRepair() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if (!name || !phone) { toast('客戶名稱和電話必填', true); return; }

  const payload = {
    customer_name: name,
    phone,
    brand:       document.getElementById('f-brand-form').value,
    model:       document.getElementById('f-model').value.trim() || null,
    repair_item: document.getElementById('f-item').value.trim(),
    repair_date: document.getElementById('f-date').value,
    status:      document.getElementById('f-status-form').value,
    price:       Number(document.getElementById('f-price').value) || 0,
    cost:        Number(document.getElementById('f-cost').value)  || 0,
    is_deleted: false,
  };

  const id = document.getElementById('form-id').value;
  let error;
  if (id) {
    ({ error } = await sb.from('repairs').update(payload).eq('id', id));
  } else {
    ({ error } = await sb.from('repairs').insert(payload));
  }

  if (error) { toast(error.message, true); return; }
  toast(id ? '已儲存' : '新增成功');
  closeForm();
  load();
}

async function deleteRepair() {
  const id = document.getElementById('form-id').value;
  if (!id || !confirm('確定要刪除此筆記錄？')) return;
  const { error } = await sb.from('repairs').update({ is_deleted: true }).eq('id', id);
  if (error) { toast(error.message, true); return; }
  toast('已刪除');
  closeForm();
  load();
}

// ── 備份（匯出 Excel）────────────────────────────────────
function backup() {
  const list = getFiltered();
  if (!list.length) { toast('沒有資料可備份', true); return; }
  const rows = list.map(r => ({
    客戶名稱: r.customer_name,
    電話:     r.phone,
    品牌:     BRAND_LABELS[r.brand] ?? r.brand,
    型號:     r.model ?? '',
    維修項目: r.repair_item,
    維修日期: r.repair_date,
    狀態:     STATUS_LABELS[r.status] ?? r.status,
    售價:     Number(r.price),
    成本:     Number(r.cost),
    利潤:     Number(r.price) - Number(r.cost),
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [12,14,10,14,18,12,10,10,10,10].map(wch => ({ wch }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '維修備份');
  XLSX.writeFile(wb, `維修備份_${today()}.xlsx`);
  toast('備份成功！');
}

// ── 還原（匯入 Excel）────────────────────────────────────
async function restore(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws);

  let ok = 0, fail = 0;
  for (const row of rows) {
    const name  = String(row['客戶名稱'] ?? '').trim();
    const phone = String(row['電話']     ?? '').trim();
    const price = Number(row['售價']);
    const cost  = Number(row['成本']);
    if (!name || !phone || isNaN(price) || isNaN(cost)) { fail++; continue; }

    const brand  = BRAND_REVERSE[String(row['品牌']??'').trim()]  ?? 'other';
    const status = STATUS_REVERSE[String(row['狀態']??'').trim()] ?? 'pending';
    const { error } = await sb.from('repairs').insert({
      customer_name: name, phone, brand, status,
      model:       String(row['型號']??'').trim() || null,
      repair_item: String(row['維修項目']??'').trim(),
      repair_date: String(row['維修日期']??'').trim(),
      price, cost, is_deleted: false,
    });
    error ? fail++ : ok++;
  }
  toast(`成功還原 ${ok} 筆，失敗 ${fail} 筆`);
  load();
}

// ── 工具 ──────────────────────────────────────────────────
function fmt(n) {
  return 'NT$' + Math.round(n).toLocaleString('zh-TW');
}
function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function today() {
  return new Date().toISOString().slice(0,10);
}
function toast(msg, isError=false) {
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
